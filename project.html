  <style>
    :root{
      --bar:#0a2c56;    /* top/bottom bar color */
      --ink:#0a1a2a;    /* main text color (dark navy like :contentReference[oaicite:0]{index=0}) */
      --bg:#f5f5f5;
    }
    html,body{height:100%;margin:0}
    body{
      background:var(--bg);
      color:var(--ink);
      font-family:"Times New Roman", Times, serif;
      font-size:1.05rem;
      line-height:1.75;
    }
    .page{min-height:100svh;display:flex;flex-direction:column}

    /* Top/Bottom slim bars */
    .topbar,.bottombar{
      background:var(--bar);
      color:#fff;
      text-align:center;
      padding:.38rem .75rem;
      font-family:"Oswald","Arial Narrow",sans-serif;
      letter-spacing:.3px;
    }
    .topbar{
      position:sticky;
      top:0;
      z-index:1000;
      box-shadow:0 1px 0 rgba(0,0,0,.12);
    }
    .nav{display:flex;gap:1.5rem;justify-content:center;flex-wrap:wrap}
    .nav a{
      color:#fff;
      text-decoration:none;
      font-weight:400;
      font-size:1rem;
    }
    .nav a:hover{text-decoration:underline}

    /* Main content */
    main{
      flex:1;
      width:75%;
      margin:0 auto;
      padding:3rem 1rem 2.5rem;
    }
    h1,h2,h3{
      font-family:"Oswald","Arial Narrow",sans-serif;
      color:var(--ink);
      letter-spacing:.4px;
      margin:0 0 .5rem;
    }
    h1{font-size:2.2rem;font-weight:500;text-align:center;margin-bottom:1.5rem}
    h2{font-size:1.4rem;font-weight:500;margin-top:2rem;border-bottom:1px solid #ddd;padding-bottom:.25rem}
    p{max-width:60ch;margin:0 auto 1.25rem}

    /* Embedded frames */
    .frame{
      width:100%;
      height:600px;
      border:1px solid #ddd;
      box-shadow:0 2px 6px rgba(0,0,0,.08);
      margin:1rem 0 1.5rem;
    }

    /* Footer */
    .bottombar{margin-top:auto;font-size:.95rem}

    @media (max-width:900px){ main{width:82%} }
    @media (max-width:720px){ main{width:92%} }
  </style>
</head>
