<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · Cat on duty</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#FFF8EC;--ink:#2B2A33;--soft:#8A8794;--card:#FFFFFF;--line:#E9E1D2}
  @media (prefers-color-scheme:dark){:root{--bg:#17161C;--ink:#F4F2EC;--soft:#A19EAD;--card:#24232B;--line:#34323D}}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;text-align:center;padding:24px max(16px,env(safe-area-inset-left,0px));box-sizing:border-box}
  main{display:flex;flex-direction:column;align-items:center;gap:10px;max-width:560px}
  .gif{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;max-width:100%;box-sizing:border-box}
  .gif img{display:block;width:min(340px,80vw);height:auto;border-radius:12px}
  h1{font-weight:900;font-size:clamp(30px,7vw,48px);line-height:1.1;margin:10px 0 0;letter-spacing:-.02em;text-wrap:balance}
  p{margin:0;font-weight:700;font-size:clamp(17px,3.6vw,20px);color:var(--soft);text-wrap:balance}
  .credit{font-size:12px;font-weight:700;color:var(--soft);text-decoration:none;opacity:.8}
  .credit:hover{text-decoration:underline}
</style>
</head>
<body>
<main>
  <div class="gif">
    <img src="https://media.giphy.com/media/NFZPr107J8OMK1ZGiP/giphy.gif" alt="A cat next to a 404 error">
  </div>
  <a class="credit" href="https://giphy.com/gifs/cat-404-error-NFZPr107J8OMK1ZGiP" target="_blank" rel="noopener">GIF via GIPHY · @thedaideker</a>
  <h1>404: website not found.</h1>
  <p>The cat is looking into it. Please do not disturb the cat.</p>
</main>
</body>
</html>
