<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unplugged</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#FFF8EC;--ink:#2B2A33;--soft:#8A8794;--plug:#FFC83D;--plug-dk:#E0A800;--cord:#2B2A33;--wall:#FFFFFF;--line:#E9E1D2;--z:#7C6CF2}
  @media (prefers-color-scheme:dark){:root{--bg:#17161C;--ink:#F4F2EC;--soft:#A19EAD;--wall:#24232B;--line:#34323D;--cord:#F4F2EC}}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;text-align:center;padding:24px max(16px,env(safe-area-inset-left,0px));box-sizing:border-box}
  main{display:flex;flex-direction:column;align-items:center;gap:6px;max-width:520px}
  svg{width:min(360px,86vw);height:auto;overflow:visible}
  h1{font-weight:900;font-size:clamp(40px,9vw,64px);margin:8px 0 0;letter-spacing:-.02em}
  p{margin:0;font-weight:700;font-size:clamp(17px,3.6vw,20px);color:var(--soft)}
  .plug{animation:snooze 3.2s ease-in-out infinite;transform-origin:150px 150px}
  @keyframes snooze{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(5px) rotate(2deg)}}
  .z{font:900 26px "Nunito",sans-serif;fill:var(--z);opacity:0;animation:z 3.6s ease-out infinite}
  .z.b{animation-delay:1.2s;font-size:20px}.z.c{animation-delay:2.4s;font-size:15px}
  @keyframes z{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(26px,-46px)}}
  .spark{animation:spark 2.4s steps(1) infinite;opacity:0}
  @keyframes spark{0%,88%{opacity:0}90%,96%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.plug,.z,.spark{animation:none}.z{opacity:1}}
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 360 230" role="img" aria-label="A sleepy plug lying next to a wall outlet">
    <!-- outlet -->
    <rect x="270" y="58" width="74" height="104" rx="16" fill="var(--wall)" stroke="var(--line)" stroke-width="4"/>
    <rect x="296" y="86" width="7" height="20" rx="3" fill="var(--soft)"/>
    <rect x="312" y="86" width="7" height="20" rx="3" fill="var(--soft)"/>
    <path d="M300 124 q7.5 9 15 0" fill="none" stroke="var(--soft)" stroke-width="5" stroke-linecap="round"/>
    <!-- cord -->
    <path d="M20 200 C 60 150, 70 230, 110 190 S 150 170, 150 172" fill="none" stroke="var(--cord)" stroke-width="7" stroke-linecap="round"/>
    <!-- plug -->
    <g class="plug">
      <rect x="168" y="130" width="8" height="26" rx="3" fill="var(--soft)" transform="rotate(-8 172 143)"/>
      <rect x="168" y="160" width="8" height="26" rx="3" fill="var(--soft)" transform="rotate(-8 172 173)"/>
      <rect x="100" y="120" width="76" height="76" rx="22" fill="var(--plug)" stroke="var(--plug-dk)" stroke-width="4"/>
      <!-- sleepy eyes -->
      <path d="M118 152 q8 7 16 0" fill="none" stroke="var(--ink)" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M144 152 q8 7 16 0" fill="none" stroke="var(--ink)" stroke-width="4.5" stroke-linecap="round"/>
      <!-- cheeks -->
      <circle cx="115" cy="166" r="6" fill="#FF8FA3" opacity=".7"/>
      <circle cx="163" cy="166" r="6" fill="#FF8FA3" opacity=".7"/>
      <!-- little mouth -->
      <ellipse cx="139" cy="174" rx="5" ry="4" fill="var(--ink)"/>
    </g>
    <!-- tiny spark between plug and outlet -->
    <path class="spark" d="M222 120 l-8 14 h9 l-6 14 16-20 h-9 l6-8z" fill="var(--plug)"/>
    <!-- zzz -->
    <text class="z" x="150" y="108">Z</text>
    <text class="z b" x="150" y="108">Z</text>
    <text class="z c" x="150" y="108">z</text>
  </svg>
  <h1>Unplugged.</h1>
  <p>Recharging for a bit. Back soon.</p>
</main>
</body>
</html>
